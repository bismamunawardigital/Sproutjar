name: Android

# Builds the phone app shell. Pull requests and dev get a debug APK you can
# install on any Android phone; main gets a signed release bundle (.aab) for
# Play Console when the signing secrets are set. Both land under the run's
# Artifacts.

on:
  push:
    branches: [dev, main]
    paths: ["android/**", "capacitor/**", "capacitor.config.ts", "package.json", "package-lock.json", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "capacitor/**", "capacitor.config.ts", "package.json", "package-lock.json", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The hosted Ubuntu image ships the Android SDK; Gradle fetches any
      # missing platform or build-tools itself.
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - run: npm ci

      - run: npx cap sync android

      - name: Debug APK
        if: github.ref != 'refs/heads/main'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        with:
          name: sproutjar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release bundle
        if: github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        with:
          name: sproutjar-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
